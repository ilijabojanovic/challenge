name: Playwright E2E

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test:
    needs: lint
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browser (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install ${{ matrix.browser }} --with-deps

      - name: Install OS deps (cache hit, browsers already there)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true
          BROWSERS: ${{ matrix.browser }}

      - name: Publish JUnit test results to GitHub
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ always() && !cancelled() && hashFiles('test-results/junit.xml') != '' }}
        with:
          files: test-results/junit.xml
          check_name: Playwright E2E (${{ matrix.browser }})
          comment_mode: off
          action_fail: false

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      - name: Upload JUnit report (XML)
        uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: junit-${{ matrix.browser }}
          path: test-results/junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Upload traces on failure
        uses: actions/upload-artifact@v4
        if: ${{ failure() && !cancelled() }}
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
